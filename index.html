
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 50px 20px;
        }

        .profile {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        .skill {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>My Profile</h1>

        <h2>สวัสดีครับ!</h2>

        <p>
            ผมเป็นนักศึกษาสาขาเทคโนโลยีสารสนเทศ
            มีความสนใจในการเขียนโปรแกรม
            และการพัฒนาเว็บไซต์
        </p>

        <h3>My Skills</h3>

        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">Python</span>

        <h3>My Goal</h3>
        <p>พัฒนาทักษะด้าน IT เพื่อก้าวสู่การเป็น Programmer</p>

    </div>

</body>
</html>
